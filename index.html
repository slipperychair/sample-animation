<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Interactive Particle Universe</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #03040c;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: crosshair;

        /* Enables touch interaction without page scrolling */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }

      .heading {
        position: fixed;
        top: 38px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 2;

        color: #f5f3ff;
        font-family: Arial, sans-serif;
        font-size: clamp(16px, 2.5vw, 30px);
        font-weight: 500;
        letter-spacing: 0.32em;
        white-space: nowrap;

        text-shadow: 0 0 18px rgba(170, 150, 255, 0.5);
        pointer-events: none;
      }
    </style>
  </head>

  <body>
    <h1 class="heading">THIS IS GREAT</h1>

    <canvas id="canvas"></canvas>

    <script>
      // ==========================================
      // CANVAS SETUP
      // ==========================================

      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      let width;
      let height;
      let dpr;

      const PARTICLE_COUNT = 480;

      const CONFIG = {
        interactionRadius: 210,
        dispersion: 1.8,
        mouseFollow: 0.15,
        returnForce: 0.008,
        friction: 0.91,
        glow: 8,
        pathWidth: 0.15,
        flowSpeed: 0.0003,
      };

      let particles = [];
      let animationTime = 0;

      // ==========================================
      // POINTER SYSTEM
      // Works with mouse AND touchscreen
      // ==========================================

      const pointer = {
        x: -1000,
        y: -1000,

        lastX: null,
        lastY: null,

        vx: 0,
        vy: 0,

        energy: 0,
        active: false,

        pointerId: null,
      };

      // Update pointer position
      function updatePointer(e) {
        const rect = canvas.getBoundingClientRect();

        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        // Calculate pointer velocity
        if (pointer.lastX !== null && pointer.lastY !== null) {
          pointer.vx = pointer.vx * 0.45 + (x - pointer.lastX) * 0.55;

          pointer.vy = pointer.vy * 0.45 + (y - pointer.lastY) * 0.55;

          pointer.vx = Math.max(-28, Math.min(28, pointer.vx));
          pointer.vy = Math.max(-28, Math.min(28, pointer.vy));
        }

        pointer.x = x;
        pointer.y = y;

        pointer.lastX = x;
        pointer.lastY = y;

        pointer.energy = 1;
        pointer.active = true;
      }

      // Mouse and touch start
      canvas.addEventListener("pointerdown", (e) => {
        if (e.pointerType === "touch") {
          pointer.pointerId = e.pointerId;

          canvas.setPointerCapture(e.pointerId);
        }

        pointer.lastX = null;
        pointer.lastY = null;

        updatePointer(e);
      });

      // Mouse movement and touch dragging
      canvas.addEventListener("pointermove", (e) => {
        // Only track the active touch
        if (e.pointerType === "touch" && pointer.pointerId !== e.pointerId) {
          return;
        }

        updatePointer(e);
      });

      // End touch interaction
      function stopTouch(e) {
        if (e.pointerType === "touch" && pointer.pointerId === e.pointerId) {
          pointer.active = false;
          pointer.energy = 0;

          pointer.lastX = null;
          pointer.lastY = null;

          pointer.pointerId = null;
        }
      }

      canvas.addEventListener("pointerup", stopTouch);
      canvas.addEventListener("pointercancel", stopTouch);
      canvas.addEventListener("lostpointercapture", stopTouch);

      // Stop mouse interaction when leaving canvas
      canvas.addEventListener("pointerleave", (e) => {
        if (e.pointerType === "mouse") {
          pointer.active = false;
          pointer.energy = 0;

          pointer.lastX = null;
          pointer.lastY = null;
        }
      });

      // ==========================================
      // RESPONSIVE CANVAS
      // ==========================================

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);

        width = window.innerWidth;
        height = window.innerHeight;

        canvas.width = width * dpr;
        canvas.height = height * dpr;

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        createParticles();
      }

      // ==========================================
      // S-SHAPED PARTICLE PATH
      // ==========================================

      function getPath(t) {
        const x0 = width * 0.05;
        const y0 = height * 0.7;

        const x1 = width * 0.29;
        const y1 = height * 0.12;

        const x2 = width * 0.71;
        const y2 = height * 0.9;

        const x3 = width * 0.95;
        const y3 = height * 0.3;

        const u = 1 - t;

        // Bezier curve position
        const x =
          u * u * u * x0 +
          3 * u * u * t * x1 +
          3 * u * t * t * x2 +
          t * t * t * x3;

        const y =
          u * u * u * y0 +
          3 * u * u * t * y1 +
          3 * u * t * t * y2 +
          t * t * t * y3;

        // Direction along the curve
        const dx =
          3 * u * u * (x1 - x0) + 6 * u * t * (x2 - x1) + 3 * t * t * (x3 - x2);

        const dy =
          3 * u * u * (y1 - y0) + 6 * u * t * (y2 - y1) + 3 * t * t * (y3 - y2);

        const length = Math.sqrt(dx * dx + dy * dy) || 1;

        // Perpendicular direction
        const nx = -dy / length;
        const ny = dx / length;

        return { x, y, nx, ny };
      }

      // ==========================================
      // CREATE PARTICLES
      // ==========================================

      function createParticles() {
        particles = [];

        const bandWidth = Math.min(width, height) * CONFIG.pathWidth;

        for (let i = 0; i < PARTICLE_COUNT; i++) {
          const progress = 0.015 + Math.random() * 0.97;

          const offset = (Math.random() - 0.5) * bandWidth;

          const path = getPath(progress);

          const x = path.x + path.nx * offset;
          const y = path.y + path.ny * offset;

          particles.push({
            progress: progress,

            direction: Math.random() > 0.5 ? 1 : -1,

            flowSpeed: CONFIG.flowSpeed * (0.5 + Math.random()),

            offset: offset,

            x: x,
            y: y,

            homeX: x,
            homeY: y,

            vx: 0,
            vy: 0,

            size: Math.random() * 1.5 + 0.6,

            brightness: Math.random() * 0.5 + 0.5,

            phase: Math.random() * Math.PI * 2,

            color: Math.random() > 0.8 ? "190,180,255" : "240,240,255",
          });
        }
      }

      // ==========================================
      // DRAW PATH GUIDE
      // ==========================================

      function drawGuidePath() {
        ctx.beginPath();

        const start = getPath(0);

        ctx.moveTo(start.x, start.y);

        for (let i = 1; i <= 100; i++) {
          const p = getPath(i / 100);

          ctx.lineTo(p.x, p.y);
        }

        ctx.strokeStyle = "rgba(150,140,255,0.045)";
        ctx.lineWidth = 2;

        ctx.shadowBlur = 12;
        ctx.shadowColor = "#7777ff";

        ctx.stroke();

        ctx.shadowBlur = 0;
      }

      // ==========================================
      // MAIN ANIMATION
      // ==========================================

      function animate() {
        requestAnimationFrame(animate);

        animationTime += 0.016;

        // Create smooth motion trails
        ctx.fillStyle = "rgba(3,4,12,0.20)";

        ctx.fillRect(0, 0, width, height);

        // Gradually reduce pointer influence
        pointer.energy *= 0.975;

        pointer.vx *= 0.88;
        pointer.vy *= 0.88;

        drawGuidePath();

        // ======================================
        // PARTICLE PHYSICS
        // ======================================

        for (const p of particles) {
          // Move particle along the S-shaped path
          p.progress += p.direction * p.flowSpeed;

          // Reverse at the endpoints
          if (p.progress >= 0.985) {
            p.progress = 0.985;
            p.direction = -1;
          }

          if (p.progress <= 0.015) {
            p.progress = 0.015;
            p.direction = 1;
          }

          // Calculate its natural position
          const path = getPath(p.progress);

          p.homeX = path.x + path.nx * p.offset;

          p.homeY = path.y + path.ny * p.offset;

          // ==================================
          // MOUSE / TOUCH DISPERSION
          // ==================================

          const dx = p.x - pointer.x;
          const dy = p.y - pointer.y;

          const distance = Math.sqrt(dx * dx + dy * dy);

          if (
            pointer.active &&
            pointer.energy > 0.015 &&
            distance < CONFIG.interactionRadius
          ) {
            const influence =
              Math.pow(1 - distance / CONFIG.interactionRadius, 2) *
              pointer.energy;

            const nx = distance > 0.1 ? dx / distance : 1;

            const ny = distance > 0.1 ? dy / distance : 0;

            // Scatter away from pointer
            p.vx += nx * influence * CONFIG.dispersion;

            p.vy += ny * influence * CONFIG.dispersion;

            // Temporarily follow pointer movement
            p.vx += pointer.vx * influence * CONFIG.mouseFollow;

            p.vy += pointer.vy * influence * CONFIG.mouseFollow;

            // Add swirling effect
            p.vx += -ny * influence * 0.3;
            p.vy += nx * influence * 0.3;
          }

          // ==================================
          // RETURN TO FLOWING PATH
          // ==================================

          p.vx += (p.homeX - p.x) * CONFIG.returnForce;

          p.vy += (p.homeY - p.y) * CONFIG.returnForce;

          // Smooth friction
          p.vx *= CONFIG.friction;
          p.vy *= CONFIG.friction;

          // Speed limits
          p.vx = Math.max(-18, Math.min(18, p.vx));
          p.vy = Math.max(-18, Math.min(18, p.vy));

          // Update position
          p.x += p.vx;
          p.y += p.vy;

          // ==================================
          // DRAW PARTICLE
          // ==================================

          const twinkle = 0.8 + Math.sin(animationTime * 2 + p.phase) * 0.2;

          const opacity = p.brightness * twinkle;

          ctx.beginPath();

          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);

          ctx.fillStyle = `rgba(${p.color},${opacity})`;

          ctx.shadowBlur = CONFIG.glow * p.size;

          ctx.shadowColor = p.color === "190,180,255" ? "#aaaaff" : "#ffffff";

          ctx.fill();
        }

        ctx.shadowBlur = 0;
      }

      // ==========================================
      // START APPLICATION
      // ==========================================

      window.addEventListener("resize", resize);

      resize();
      animate();
    </script>
  </body>
</html>
