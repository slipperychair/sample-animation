<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#03040c" />
  <title>This Is Great — Particle Flow</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #03040c; }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #scene, #trails { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #scene { z-index: 0; touch-action: none; cursor: crosshair; }
    #trails { z-index: 1; pointer-events: none; }
    h1 {
      position: fixed; z-index: 2; top: clamp(22px, 5vh, 52px); left: 0; width: 100%;
      margin: 0; padding: 0 16px; text-align: center; pointer-events: none;
      color: rgba(247, 245, 255, .94); font-size: clamp(18px, 3vw, 30px);
      font-weight: 650; letter-spacing: .34em; text-indent: .34em;
      text-shadow: 0 0 18px rgba(178, 143, 255, .35);
    }
    .hint {
      position: fixed; z-index: 2; bottom: max(18px, env(safe-area-inset-bottom));
      left: 0; width: 100%; text-align: center; pointer-events: none;
      color: rgba(205, 199, 230, .43); font-size: 11px; letter-spacing: .12em;
    }
    #status {
      position: fixed; z-index: 3; inset: auto 12px 12px 12px; display: none;
      color: #e8ddff; background: #171326; border: 1px solid #51416f;
      border-radius: 8px; padding: 12px; font: 13px/1.5 system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <h1>THIS IS GREAT</h1>
  <canvas id="scene" aria-label="Interactive flowing particle animation"></canvas>
  <canvas id="trails" aria-hidden="true"></canvas>
  <div class="hint">MOVE YOUR POINTER OR TOUCH THE PARTICLES</div>
  <div id="status" role="status"></div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

    (() => {
      const canvas = document.getElementById("scene");
      const trailCanvas = document.getElementById("trails");
      const trailCtx = trailCanvas.getContext("2d");
      const status = document.getElementById("status");
      const PARTICLE_COUNT = 480;
      const particles = [];
      const pointer = { x: 0, y: 0, active: false, vx: 0, vy: 0, last: 0 };
      let width = 0, height = 0, pixelRatio = 1, previousTime = 0;

      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
      const random = (a, b) => a + Math.random() * (b - a);

      let renderer;
      try {
        renderer = new THREE.WebGLRenderer({
          canvas,
          antialias: true,
          alpha: false,
          powerPreference: "high-performance"
        });
      } catch (error) {
        status.style.display = "block";
        status.textContent = "WebGL is unavailable in this browser. Try an updated version of Chrome, Edge, or Firefox with hardware acceleration enabled.";
        return;
      }

      renderer.setClearColor(0x03040c, 1);
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      const scene = new THREE.Scene();
      const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 10);
      camera.position.z = 2;

      // The particle positions are updated on the CPU; GLSL handles their glow,
      // soft edges, colour and per-particle brightness on the GPU.
      const vertexShader = `
        attribute float aSize;
        attribute float aAlpha;
        attribute vec3 aColor;
        attribute float aPhase;
        uniform float uPixelRatio;
        uniform float uTime;
        varying vec3 vColor;
        varying float vAlpha;
        varying float vTwinkle;
        void main() {
          vec4 viewPosition = modelViewMatrix * vec4(position, 1.0);
          gl_Position = projectionMatrix * viewPosition;
          gl_PointSize = aSize * 7.0 * uPixelRatio;
          vColor = aColor;
          vAlpha = aAlpha;
          vTwinkle = 0.82 + 0.18 * sin(uTime * 1.8 + aPhase);
        }
      `;

      const fragmentShader = `
        varying vec3 vColor;
        varying float vAlpha;
        varying float vTwinkle;
        void main() {
          vec2 point = gl_PointCoord - vec2(0.5);
          float d = length(point);
          float halo = 1.0 - smoothstep(0.05, 0.5, d);
          float core = 1.0 - smoothstep(0.02, 0.17, d);
          float glow = halo * 0.22 + core * 0.95;
          if (glow < 0.008) discard;
          gl_FragColor = vec4(vColor * (0.72 + core * 0.55), glow * vAlpha * vTwinkle);
        }
      `;

      const positions = new Float32Array(PARTICLE_COUNT * 3);
      const sizes = new Float32Array(PARTICLE_COUNT);
      const alphas = new Float32Array(PARTICLE_COUNT);
      const colors = new Float32Array(PARTICLE_COUNT * 3);
      const phases = new Float32Array(PARTICLE_COUNT);
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3).setUsage(THREE.DynamicDrawUsage));
      geometry.setAttribute("aSize", new THREE.BufferAttribute(sizes, 1));
      geometry.setAttribute("aAlpha", new THREE.BufferAttribute(alphas, 1));
      geometry.setAttribute("aColor", new THREE.BufferAttribute(colors, 3));
      geometry.setAttribute("aPhase", new THREE.BufferAttribute(phases, 1));

      const uniforms = {
        uPixelRatio: { value: 1 },
        uTime: { value: 0 }
      };
      const material = new THREE.ShaderMaterial({
        uniforms,
        vertexShader,
        fragmentShader,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });
      const pointCloud = new THREE.Points(geometry, material);
      pointCloud.frustumCulled = false;
      scene.add(pointCloud);

      // A cubic Bezier curve gives the same flowing S-shaped path as the original.
      function pathPoint(t) {
        const x0 = width * 0.10, x1 = width * 0.90;
        const y0 = height * 0.30, y1 = height * 0.72;
        const bend = Math.min(height * 0.27, width * 0.20);
        const p0 = { x: x0, y: y0 };
        const p1 = { x: width * 0.82, y: y0 - bend };
        const p2 = { x: width * 0.18, y: y1 + bend };
        const p3 = { x: x1, y: y1 };
        const u = 1 - t;
        return {
          x: u*u*u*p0.x + 3*u*u*t*p1.x + 3*u*t*t*p2.x + t*t*t*p3.x,
          y: u*u*u*p0.y + 3*u*u*t*p1.y + 3*u*t*t*p2.y + t*t*t*p3.y
        };
      }

      function createParticle(i) {
        const t = i / PARTICLE_COUNT;
        const p = pathPoint(t);
        const violet = Math.random() < 0.28;
        return {
          t,
          speed: random(0.000055, 0.000105),
          x: p.x + random(-10, 10),
          y: p.y + random(-10, 10),
          vx: 0, vy: 0,
          size: random(0.65, 1.8),
          alpha: random(0.45, 0.95),
          violet,
          phase: random(0, Math.PI * 2),
          reverse: false
        };
      }

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const p = createParticle(i);
        particles.push(p);
        sizes[i] = p.size;
        alphas[i] = p.alpha;
        phases[i] = p.phase;
        const c = p.violet ? [0.745, 0.592, 1.0] : [0.92, 0.94, 1.0];
        colors.set(c, i * 3);
      }

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        renderer.setPixelRatio(pixelRatio);
        renderer.setSize(width, height, false);
        trailCanvas.width = Math.round(width * pixelRatio);
        trailCanvas.height = Math.round(height * pixelRatio);
        trailCanvas.style.width = width + "px";
        trailCanvas.style.height = height + "px";
        trailCtx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
        camera.left = -width / 2;
        camera.right = width / 2;
        camera.top = height / 2;
        camera.bottom = -height / 2;
        camera.updateProjectionMatrix();
        uniforms.uPixelRatio.value = pixelRatio;
        for (const p of particles) {
          const target = pathPoint(p.t);
          p.x = target.x;
          p.y = target.y;
          p.vx = 0;
          p.vy = 0;
        }
      }

      function setPointer(e) {
        const now = performance.now();
        const dt = Math.max(8, now - pointer.last);
        const x = e.clientX, y = e.clientY;
        pointer.vx = clamp((x - pointer.x) / dt, -2.5, 2.5);
        pointer.vy = clamp((y - pointer.y) / dt, -2.5, 2.5);
        pointer.x = x;
        pointer.y = y;
        pointer.last = now;
        pointer.active = true;
      }

      canvas.addEventListener("pointerdown", e => {
        setPointer(e);
        if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
      }, { passive: true });
      canvas.addEventListener("pointermove", e => setPointer(e), { passive: true });
      const releasePointer = () => { pointer.active = false; };
      canvas.addEventListener("pointerup", releasePointer, { passive: true });
      canvas.addEventListener("pointercancel", releasePointer, { passive: true });
      canvas.addEventListener("lostpointercapture", releasePointer, { passive: true });
      canvas.addEventListener("pointerleave", e => {
        if (e.pointerType === "mouse") pointer.active = false;
      }, { passive: true });
      window.addEventListener("resize", resize, { passive: true });

      function animate(now) {
        requestAnimationFrame(animate);
        const delta = previousTime ? Math.min(now - previousTime, 40) : 16.67;
        previousTime = now;
        const pointerMoving = pointer.active && now - pointer.last < 110;
        const influenceRadius = Math.min(150, Math.max(105, width * 0.13));

        // Fade the transparent 2D overlay to retain the original subtle particle trails.
        trailCtx.fillStyle = "rgba(3, 4, 12, 0.24)";
        trailCtx.fillRect(0, 0, width, height);

        for (let i = 0; i < PARTICLE_COUNT; i++) {
          const p = particles[i];
          p.t += p.speed * delta * (p.reverse ? -1 : 1);
          if (p.t >= 1) { p.t = 1; p.reverse = true; }
          if (p.t <= 0) { p.t = 0; p.reverse = false; }

          const target = pathPoint(p.t);
          const wave = Math.sin(now * 0.0007 + p.phase) * 2.2;
          const tx = target.x + wave;
          const ty = target.y + Math.cos(now * 0.00055 + p.phase) * 2.2;
          let ax = (tx - p.x) * 0.018;
          let ay = (ty - p.y) * 0.018;

          if (pointer.active) {
            const dx = p.x - pointer.x, dy = p.y - pointer.y;
            const dist = Math.hypot(dx, dy);
            if (dist < influenceRadius && dist > 0.01) {
              const force = Math.pow(1 - dist / influenceRadius, 2) * (pointerMoving ? 2.4 : 1.35);
              const nx = dx / dist, ny = dy / dist;
              ax += nx * force;
              ay += ny * force;
              if (pointerMoving) {
                ax += pointer.vx * force * 0.16;
                ay += pointer.vy * force * 0.16;
              }
            }
          }

          p.vx = (p.vx + ax) * 0.91;
          p.vy = (p.vy + ay) * 0.91;
          p.x += p.vx;
          p.y += p.vy;

          // Convert screen coordinates to the orthographic camera's world coordinates.
          positions[i * 3] = p.x - width / 2;
          positions[i * 3 + 1] = height / 2 - p.y;
          positions[i * 3 + 2] = 0;

          // Preserve the original soft trail and its white/violet particle palette.
          const rgb = p.violet ? "190, 151, 255" : "235, 239, 255";
          const twinkle = 0.72 + Math.sin(now * 0.0018 + p.phase) * 0.22;
          trailCtx.beginPath();
          trailCtx.fillStyle = `rgba(${rgb}, ${p.alpha * twinkle * 0.10})`;
          trailCtx.arc(p.x, p.y, p.size * 2.8, 0, Math.PI * 2);
          trailCtx.fill();
        }

        geometry.attributes.position.needsUpdate = true;
        uniforms.uTime.value = now * 0.001;
        renderer.render(scene, camera);
      }

      resize();
      requestAnimationFrame(animate);

      window.addEventListener("pagehide", () => {
        geometry.dispose();
        material.dispose();
        renderer.dispose();
      }, { once: true });
    })();
  </script>
</body>
</html>
